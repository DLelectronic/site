# Rode uma vez (Actions → Conectar Mercado Livre → Run workflow) com o código "TG-..."
# que aparece no endereço depois de autorizar o app no Mercado Livre.
# O código vale poucos minutos e só pode ser usado uma vez.
name: Conectar Mercado Livre

on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Código de autorização (TG-...) do endereço após autorizar o app"
        required: true

concurrency:
  group: mercado-livre
  cancel-in-progress: false

jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - name: Trocar o código pelo token e guardar no segredo
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          CODIGO: ${{ github.event.inputs.codigo }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          ML_CLIENT_ID="$(printf '%s' "$ML_CLIENT_ID" | tr -d '[:space:]')"
          ML_CLIENT_SECRET="$(printf '%s' "$ML_CLIENT_SECRET" | tr -d '[:space:]')"
          CODIGO="$(printf '%s' "$CODIGO" | tr -d '[:space:]')"
          CODIGO="${CODIGO#*code=}"; CODIGO="${CODIGO%%&*}"
          export GH_TOKEN="$(printf '%s' "$GH_TOKEN" | tr -d '[:space:]')"
          resp=$(curl -sS -X POST https://api.mercadolibre.com/oauth/token \
            -H "accept: application/json" -H "content-type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=authorization_code" \
            --data-urlencode "client_id=$ML_CLIENT_ID" \
            --data-urlencode "client_secret=$ML_CLIENT_SECRET" \
            --data-urlencode "code=$CODIGO" \
            --data-urlencode "redirect_uri=https://dlelectronic.com.br/")
          rt=$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("refresh_token",""))')
          if [ -z "$rt" ]; then
            echo "O Mercado Livre não devolveu o token. Resposta (sem dados sensíveis):"
            printf '%s' "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); print({k: d.get(k) for k in ("error","message","status")})'
            exit 1
          fi
          echo "::add-mask::$rt"
          printf '%s' "$rt" | gh secret set ML_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "Conectado. A sincronização roda a cada 2 horas (ou rode 'Sincronizar Mercado Livre' agora)."
